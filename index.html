<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F05359">
    <title>Boogschieten Score</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --kleur-10: #FBD036; --kleur-9: #F05359; --kleur-8: #52B5D9;
            --kleur-7: #2F4159; --kleur-6: #FFFFFF; --kleur-mis: #444444;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #74C8D4 0%, #F05359 100%);
            color: white; display: flex; height: 100vh; width: 100vw;
            overflow: hidden; user-select: none;
        }

        @media screen and (orientation: portrait) {
            body::before {
                content: "Draai de tablet horizontaal! 🔄";
                position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                background: var(--kleur-8); color: white;
                display: flex; align-items: center; justify-content: center;
                font-size: 3rem; z-index: 1000; text-align: center; padding: 20px;
            }
        }

        .glass-paneel {
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 10px;
        }

        .scherm { display: none; width: 100%; height: 100%; box-sizing: border-box; }
        .actief-scherm { display: flex; }

        /* Setup Scherm */
        #setup-scherm { align-items: center; justify-content: center; padding: 20px; }
        .setup-box { 
            text-align: center; max-width: 700px; width: 100%; 
            max-height: 95vh; overflow-y: auto; padding: 20px;
        }
        .setup-box h1 { color: var(--kleur-10); margin-top: 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); font-size: 2.5rem; }
        
        .input-groep { margin-bottom: 12px; text-align: left; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; }
        label { display: block; font-size: 1.1rem; margin-bottom: 8px; font-weight: bold; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
        
        .doel-knoppen { display: flex; gap: 8px; justify-content: space-between; }
        .spelers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
        
        .btn-optie {
            flex: 1; padding: 10px 2px; font-size: 1.1rem; border-radius: 12px;
            border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: white;
            transition: all 0.2s; font-family: inherit; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-optie.gekozen {
            background: var(--kleur-10); color: black;
            transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        select, input[type="text"] { 
            width: 100%; padding: 10px; font-size: 1.2rem; font-family: inherit;
            border-radius: 10px; border: none; box-sizing: border-box; background: rgba(255,255,255,0.9);
        }
        
        .speler-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        
        .btn-start {
            background-color: #28A745; color: white; font-size: 2rem;
            padding: 12px 40px; border: none; border-radius: 15px;
            cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;
            box-shadow: 0 6px 0px #1E7E34; transition: transform 0.1s;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 0px 0px #1E7E34; }

        /* Game Scherm Layout */
        #game-scherm { gap: 10px; padding: 10px; }
        
        .kolom-links { flex: 0.8; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        #leaderboardLijst { flex: 1; overflow-y: auto; padding-right: 5px; }
        
        .kolom-midden { flex: 1.3; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
        .kolom-rechts { flex: 1.9; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        /* Leaderboard */
        .speler-rij {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.1); padding: 8px 12px;
            border-radius: 12px; margin-bottom: 8px; font-size: 1rem; transition: all 0.3s;
        }
        .speler-rij.actief {
            background: var(--kleur-10); color: black; font-weight: bold;
            transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid white;
        }
        .speler-rij .score-tekst { font-size: 1.3rem; font-weight: bold; }
        .speler-info-wrapper { display: flex; flex-direction: column; flex: 1; }

        .mini-doelwit { position: relative; width: 45px; height: 45px; margin-left: 10px; flex-shrink: 0; }
        .mini-doelwit svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Bewegende Statistieken Linksonder */
        .vergelijking-box {
            background: rgba(0, 0, 0, 0.25); border-radius: 12px; padding: 12px;
            min-height: 120px; transition: opacity 0.5s ease-in-out; border: 1px solid rgba(255,255,255,0.1);
        }
        .vergelijking-titel {
            font-weight: bold; font-size: 1rem; border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 5px; margin-bottom: 8px; color: var(--kleur-10);
        }
        .vergelijking-lijst {
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.9rem;
        }

        /* Middenpaneel Info */
        .speler-naam { font-size: 2.2rem; color: var(--kleur-10); margin: 0; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); line-height: 1; }
        .doel-tekst { font-size: 0.9rem; color: #EEE; margin-bottom: 5px; }
        .pijlen-indicator { font-size: 1.5rem; margin: 2px 0; letter-spacing: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* Statistieken Middenkolom */
        .speler-stats {
            font-size: 0.85rem; color: rgba(255, 255, 255, 0.9); margin: 5px auto; padding: 8px 15px;
            background: rgba(0, 0, 0, 0.2); border-radius: 12px; width: max-content;
            max-width: 95%; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 15px; text-align: left;
        }
        .stat-lijn { white-space: nowrap; }
        .avg-lijn { 
            grid-column: span 2; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); 
            padding-top: 4px; margin-top: 2px; font-weight: bold; color: var(--kleur-10);
        }

        /* Voortgangs Doelwit (Midden) */
        .visueel-doelwit { position: relative; width: 140px; height: 140px; margin: auto; }
        .visueel-doelwit svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .doelwit-grijs { filter: grayscale(100%) opacity(30%); }
        .doelwit-kleur { clip-path: inset(100% 0 0 0); transition: clip-path 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        .score-display { font-size: 3.5rem; font-weight: bold; color: white; text-shadow: 3px 3px 0px rgba(0,0,0,0.5); margin: 0; }

        .actie-knoppen { display: flex; gap: 8px; width: 100%; margin-top: auto; }
        .btn-actie {
            padding: 10px 8px; font-size: 0.9rem; border: none; border-radius: 12px;
            cursor: pointer; font-weight: bold; color: white; box-shadow: 0 4px 0px rgba(0,0,0,0.3);
        }
        .btn-actie:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.3); }

        /* --- NIEUW: ZWEVENDE SCORE ANIMATIE --- */
        @keyframes zweefAnimatie {
            0% { opacity: 0; transform: translateY(3px) scale(0.5); }
            15% { opacity: 1; transform: translateY(0px) scale(1.1); }
            30% { transform: translateY(-2px) scale(1); }
            100% { opacity: 0; transform: translateY(-12px) scale(1); }
        }
        .zwevende-score {
            animation: zweefAnimatie 1.2s ease-out forwards;
            pointer-events: none; /* Blokkeert geen nieuwe kliks */
            transform-box: fill-box;
            transform-origin: center center;
        }

        .gewonnen-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 10; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .gewonnen-tekst { font-size: 5rem; color: var(--kleur-10); text-shadow: 0 0 30px var(--kleur-10); text-align: center; margin-bottom: 30px;}
    </style>
</head>
<body>

    <!-- SCHERM 1: INSTELLINGEN -->
    <div id="setup-scherm" class="scherm actief-scherm">
        <div class="glass-paneel setup-box">
            <h1>🏹 Tijd om te schieten! 🎯</h1>
            
            <div class="input-groep">
                <label>🏆 Punten om te winnen:</label>
                <div class="doel-knoppen">
                    <button class="btn-optie" onclick="kiesDoel(20, this)">20 ⭐</button>
                    <button class="btn-optie" onclick="kiesDoel(40, this)">40 🌟</button>
                    <button class="btn-optie gekozen" onclick="kiesDoel(60, this)">60 💫</button>
                    <button class="btn-optie" onclick="kiesDoel(80, this)">80 ✨</button>
                    <button class="btn-optie" onclick="kiesDoel(100, this)">100 🏆</button>
                </div>
            </div>

            <div class="input-groep">
                <label>🎯 Pijlen per beurt:</label>
                <div class="doel-knoppen" id="knoppenPijlen">
                    <button class="btn-optie" onclick="kiesPijlen(1, this)">1 🏹</button>
                    <button class="btn-optie gekozen" onclick="kiesPijlen(2, this)">2 🏹</button>
                    <button class="btn-optie" onclick="kiesPijlen(3, this)">3 🏹</button>
                    <button class="btn-optie" onclick="kiesPijlen(4, this)">4 🏹</button>
                </div>
            </div>

            <div class="input-groep">
                <label>👥 Aantal Spelers:</label>
                <div class="spelers-grid" id="knoppenSpelers">
                    <button class="btn-optie" onclick="kiesAantalSpelers(1, this)">1 👤</button>
                    <button class="btn-optie gekozen" onclick="kiesAantalSpelers(2, this)">2 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(3, this)">3 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(4, this)">4 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(5, this)">5 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(6, this)">6 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(7, this)">7 👤</button>
                    <button class="btn-optie" onclick="kiesAantalSpelers(8, this)">8 👤</button>
                </div>
                <div id="spelerNamenDiv" class="speler-inputs"></div>
            </div>

            <button class="btn-start" onclick="startSpel()">🚀 Spelen maar!</button>
        </div>
    </div>

    <!-- SCHERM 2: HET SPEL -->
    <div id="game-scherm" class="scherm">
        
        <div class="glass-paneel kolom-links">
            <div id="leaderboardLijst">
                <!-- Wordt gevuld via JS -->
            </div>
            
            <div class="vergelijking-box" id="vergelijkingBox">
                <!-- Wordt elke 4 seconden geüpdatet -->
            </div>
        </div>

        <div class="glass-paneel kolom-midden">
            <div>
                <h2 class="speler-naam" id="huidigeSpelerNaam">Naam</h2>
                <div class="doel-tekst">Speelt tot <span id="weergaveDoelScore">60</span></div>
                <div class="pijlen-indicator" id="pijlenIndicator">🎯🎯</div>
            </div>

            <div class="visueel-doelwit">
                <svg viewBox="0 0 100 100" class="doelwit-grijs">
                    <circle cx="50" cy="50" r="48" fill="#FFF" stroke="#000" stroke-width="2"/>
                    <circle cx="50" cy="50" r="38" fill="#2F4159"/>
                    <circle cx="50" cy="50" r="28" fill="#52B5D9"/>
                    <circle cx="50" cy="50" r="18" fill="#F05359"/>
                    <circle cx="50" cy="50" r="8"  fill="#FBD036"/>
                </svg>
                <svg viewBox="0 0 100 100" class="doelwit-kleur" id="doelwitVulling">
                    <circle cx="50" cy="50" r="48" fill="#FFF" stroke="#000" stroke-width="2"/>
                    <circle cx="50" cy="50" r="38" fill="#2F4159"/>
                    <circle cx="50" cy="50" r="28" fill="#52B5D9"/>
                    <circle cx="50" cy="50" r="18" fill="#F05359"/>
                    <circle cx="50" cy="50" r="8"  fill="#FBD036"/>
                </svg>
            </div>

            <div class="score-display">
                <span id="huidigeScore">0</span>
            </div>
            
            <div id="spelerStats" class="speler-stats">
                <!-- Statistieken in lijstvorm via JS -->
            </div>

            <div class="actie-knoppen">
                <button class="btn-actie" onclick="bevestigStop()" style="background-color: #DC3545; flex: 0.3;" title="Stop Spel">❌</button>
                <button class="btn-actie" onclick="undo()" style="background-color: #E0A800; flex: 1;">Oeps ↩</button>
                <button class="btn-actie" onclick="volgendeSpelerHandmatig()" style="background-color: #17A2B8; flex: 1;" id="btnVolgende">Volgende ➔</button>
            </div>
        </div>

        <!-- De Grote Interactieve Rechterkolom (Cijferknoppen zijn weg!) -->
        <div class="kolom-rechts">
            <h3 style="margin:0 0 15px 0; color: #FFF; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Tik op het bord om te schieten! 👇</h3>
            
            <!-- overflow="visible" zorgt dat de zwevende tekst niet wordt afgesneden aan de randen -->
            <svg id="klikBord" viewBox="0 0 100 100" style="width: 100%; max-height: 80vh; cursor: crosshair; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4)); overflow: visible;" onclick="schietPijl(event)">
                <defs>
                    <linearGradient id="bordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#74C8D4"/>
                        <stop offset="100%" stop-color="#F05359"/>
                    </linearGradient>
                </defs>
                
                <rect x="0" y="0" width="100" height="100" rx="15" fill="url(#bordGrad)" />
                
                <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#000" stroke-width="0.5"/> <!-- Score 6 -->
                <circle cx="50" cy="50" r="36" fill="#2F4159"/> <!-- Score 7 -->
                <circle cx="50" cy="50" r="27" fill="#52B5D9"/> <!-- Score 8 -->
                <circle cx="50" cy="50" r="18" fill="#F05359"/> <!-- Score 9 -->
                <circle cx="50" cy="50" r="9"  fill="#FBD036"/> <!-- Score 10 -->
                
                <g id="hit-markers-rechts"></g>
            </svg>
        </div>
    </div>

    <div id="gewonnen-scherm" class="gewonnen-overlay">
        <div class="gewonnen-tekst" id="winnaarTekst">Wint! 🏆</div>
        <button class="btn-start" style="width: auto; padding: 20px 50px;" onclick="terugNaarMenu()">Nieuw Spel</button>
    </div>

    <script>
        let spelers = [];
        let huidigeSpelerIndex = 0;
        let doelScore = 60;
        let aantalPijlenPerBeurt = 2; 
        let aantalSpelersGekozen = 2;
        let pijlenGeschoten = 0;
        let geschiedenis = [];
        let autoNextTimeout = null;
        let isBeurtWissel = false;
        let audioCtx = null;
        
        let carrouselInterval = null;
        let carrouselIndex = 0;
        const statTypes = [
            { label: "Aantal keer 10", score: 10, icoon: "🎯" },
            { label: "Aantal keer 9", score: 9, icoon: "🔴" },
            { label: "Aantal keer 8", score: 8, icoon: "🔵" },
            { label: "Aantal keer 7", score: 7, icoon: "🌑" },
            { label: "Aantal keer 6", score: 6, icoon: "⚪" },
            { label: "Aantal keer Mis", score: 0, icoon: "❌" }
        ];

        const standaardNamen = ["Lou", "Noé"];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function speelGeluid(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'swoosh') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else if (type === 'juich') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, t);
                osc.frequency.setValueAtTime(659.25, t + 0.1);
                osc.frequency.setValueAtTime(783.99, t + 0.2);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.6);
                osc.start(t); osc.stop(t + 0.6);
            } else if (type === 'mis') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.2);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.start(t); osc.stop(t + 0.2);
            }
        }

        function kiesDoel(score, btnElement) {
            doelScore = score;
            btnElement.parentNode.querySelectorAll('.btn-optie').forEach(b => b.classList.remove('gekozen'));
            btnElement.classList.add('gekozen');
        }

        function kiesPijlen(aantal, btnElement) {
            aantalPijlenPerBeurt = aantal;
            btnElement.parentNode.querySelectorAll('.btn-optie').forEach(b => b.classList.remove('gekozen'));
            btnElement.classList.add('gekozen');
        }

        function kiesAantalSpelers(aantal, btnElement) {
            aantalSpelersGekozen = aantal;
            btnElement.parentNode.querySelectorAll('.btn-optie').forEach(b => b.classList.remove('gekozen'));
            btnElement.classList.add('gekozen');
            genereerSpelerInputs();
        }

        function genereerSpelerInputs() {
            const container = document.getElementById('spelerNamenDiv');
            container.innerHTML = '';
            for(let i = 0; i < aantalSpelersGekozen; i++) {
                const defaultNaam = standaardNamen[i] || `Speler ${i+1}`;
                container.innerHTML += `<input type="text" id="naamSpeler${i}" value="${defaultNaam}">`;
            }
        }

        function startSpel() {
            initAudio();
            document.getElementById('weergaveDoelScore').innerText = doelScore;
            
            spelers = [];
            geschiedenis = [];
            pijlenGeschoten = 0;
            huidigeSpelerIndex = 0;
            isBeurtWissel = false;

            for(let i = 0; i < aantalSpelersGekozen; i++) {
                const naamInput = document.getElementById(`naamSpeler${i}`);
                const naam = naamInput ? naamInput.value : `Speler ${i+1}`;
                spelers.push({ naam: naam, scores: [], totaal: 0, hitMarkers: [] });
            }

            document.getElementById('btnVolgende').style.display = (spelers.length > 1) ? 'block' : 'none';
            document.getElementById('hit-markers-rechts').innerHTML = '';
            
            wisselScherm('game-scherm');
            updateUI();

            if (carrouselInterval) clearInterval(carrouselInterval);
            carrouselIndex = 0;
            tekenVergelijkingHTML(); 
            carrouselInterval = setInterval(roteerCarrousel, 4500);
        }

        function roteerCarrousel() {
            const box = document.getElementById('vergelijkingBox');
            if(!box) return;
            box.style.opacity = 0;
            setTimeout(() => {
                carrouselIndex = (carrouselIndex + 1) % statTypes.length;
                tekenVergelijkingHTML();
                box.style.opacity = 1;
            }, 500);
        }

        function tekenVergelijkingHTML() {
            const box = document.getElementById('vergelijkingBox');
            if(!box || spelers.length === 0) return;
            const type = statTypes[carrouselIndex];

            let html = `<div class="vergelijking-titel">${type.icoon} ${type.label}</div>`;
            
            let resultaten = spelers.map(p => ({
                naam: p.naam,
                count: p.scores.filter(s => s === type.score).length
            }));
            resultaten.sort((a,b) => b.count - a.count);

            html += `<div class="vergelijking-lijst">`;
            resultaten.forEach(r => { html += `<div>${r.naam}: <b>${r.count}x</b></div>`; });
            html += `</div>`;
            box.innerHTML = html;
        }

        function wisselScherm(schermId) {
            document.querySelectorAll('.scherm').forEach(s => s.classList.remove('actief-scherm'));
            document.getElementById(schermId).classList.add('actief-scherm');
        }

        // Berekent de coördinaten en vult de juiste score in
        function schietPijl(event) {
            if (isBeurtWissel) return;

            const svg = document.getElementById('klikBord');
            const pt = svg.createSVGPoint();
            pt.x = event.clientX;
            pt.y = event.clientY;
            
            // Rekent de klik op het scherm om naar het interne assenstelsel van de SVG (0-100)
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
            
            // Afstand berekenen vanaf het exacte middelpunt (50, 50)
            const dx = svgP.x - 50;
            const dy = svgP.y - 50;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            let score = 0;
            if (distance <= 9) score = 10;
            else if (distance <= 18) score = 9;
            else if (distance <= 27) score = 8;
            else if (distance <= 36) score = 7;
            else if (distance <= 45) score = 6;
            else score = 0; // Geklikt buiten de witte ring

            voegScoreToe(score, svgP.x, svgP.y);
        }

        function voegScoreToe(punten, clickX, clickY) {
            initAudio();
            clearTimeout(autoNextTimeout);
            
            if (punten === 10) speelGeluid('juich');
            else if (punten === 0) speelGeluid('mis');
            else speelGeluid('swoosh');

            // 1. TEKEN HET BOLLETJE EXACT WAAR GEKLIKT IS
            const markerHTML = `<circle cx="${clickX.toFixed(2)}" cy="${clickY.toFixed(2)}" r="2.5" fill="#111" stroke="#FFF" stroke-width="0.8" />`;
            document.getElementById('hit-markers-rechts').insertAdjacentHTML('beforeend', markerHTML);

            // 2. VOEG VISUELE ZWEVENDE SCORE TOE
            const zweefId = 'zweef-' + Date.now();
            const scoreKleur = punten === 10 ? "#FBD036" : (punten === 0 ? "#FF3333" : "#FFFFFF");
            const scoreTekst = punten === 0 ? "Mis!" : `+${punten}`;
            
            // Tekst wordt ietsje boven het bolletje geplaatst (y - 4) en geanimeerd met CSS class 'zwevende-score'
            const zweefHTML = `<text id="${zweefId}" x="${clickX.toFixed(2)}" y="${(clickY - 4).toFixed(2)}" text-anchor="middle" font-size="7" font-weight="bold" fill="${scoreKleur}" stroke="#000" stroke-width="0.8" class="zwevende-score" style="paint-order: stroke fill;">${scoreTekst}</text>`;
            document.getElementById('hit-markers-rechts').insertAdjacentHTML('beforeend', zweefHTML);
            
            // Verwijder de zwevende tekst netjes nadat de animatie klaar is (om het geheugen schoon te houden)
            setTimeout(() => {
                const el = document.getElementById(zweefId);
                if (el) el.remove();
            }, 1200);

            // Sla de acties op voor de score en undo functionaliteit
            const speler = spelers[huidigeSpelerIndex];
            speler.scores.push(punten);
            speler.totaal += punten;
            speler.hitMarkers.push(markerHTML); // Sla ENKEL het bolletje op (de zweeftekst verdwijnt toch)
            
            geschiedenis.push({
                type: 'score',
                spelerIndex: huidigeSpelerIndex,
                punten: punten,
                markerHTML: markerHTML,
                pijlenVooraf: pijlenGeschoten
            });

            pijlenGeschoten++;
            updateUI();
            tekenVergelijkingHTML();

            if(speler.totaal >= doelScore) {
                document.getElementById('winnaarTekst').innerText = `${speler.naam} Wint! 🏆`;
                document.getElementById('gewonnen-scherm').style.display = 'flex';
                clearInterval(carrouselInterval);
                return;
            }

            if (pijlenGeschoten >= aantalPijlenPerBeurt) {
                isBeurtWissel = true; 
                autoNextTimeout = setTimeout(() => {
                    volgendeSpelerVerwerking(false);
                }, 1200); // 1.2s wachttijd geeft de laatste zwevende score tijd om mooi in beeld te komen
            }
        }

        function volgendeSpelerHandmatig() {
            clearTimeout(autoNextTimeout);
            isBeurtWissel = false;
            volgendeSpelerVerwerking(true);
        }

        function volgendeSpelerVerwerking(isHandmatig) {
            if (isHandmatig) {
                geschiedenis.push({ type: 'skip', spelerIndex: huidigeSpelerIndex, pijlenVooraf: pijlenGeschoten });
            }
            
            huidigeSpelerIndex = (huidigeSpelerIndex + 1) % spelers.length;
            pijlenGeschoten = 0;
            isBeurtWissel = false; 
            
            document.getElementById('hit-markers-rechts').innerHTML = spelers[huidigeSpelerIndex].hitMarkers.join('');
            updateUI();
        }

        function undo() {
            if (geschiedenis.length === 0) return;
            
            clearTimeout(autoNextTimeout);
            isBeurtWissel = false; 
            
            const laatsteActie = geschiedenis.pop();

            if (laatsteActie.type === 'skip') {
                huidigeSpelerIndex = laatsteActie.spelerIndex;
                pijlenGeschoten = laatsteActie.pijlenVooraf;
            } else {
                huidigeSpelerIndex = laatsteActie.spelerIndex;
                pijlenGeschoten = laatsteActie.pijlenVooraf;
                
                const speler = spelers[huidigeSpelerIndex];
                speler.scores.pop();
                speler.totaal -= laatsteActie.punten;
                speler.hitMarkers.pop();
            }

            document.getElementById('hit-markers-rechts').innerHTML = spelers[huidigeSpelerIndex].hitMarkers.join('');
            
            updateUI();
            tekenVergelijkingHTML();
        }

        function bevestigStop() {
            if(confirm("Wil je dit spel stoppen en terug naar het menu gaan?")) {
                clearInterval(carrouselInterval);
                terugNaarMenu();
            }
        }

        function renderLeaderboard() {
            let html = '';
            spelers.forEach((speler, index) => {
                const isActief = (index === huidigeSpelerIndex) ? 'actief' : '';
                
                let percentage = (speler.totaal / doelScore) * 100;
                if (percentage > 100) percentage = 100;
                const clipWaarde = 100 - percentage;

                html += `
                    <div class="speler-rij ${isActief}">
                        <div class="speler-info-wrapper">
                            <span>${speler.naam}</span>
                            <span class="score-tekst">${speler.totaal}</span>
                        </div>
                        <div class="mini-doelwit">
                            <svg viewBox="0 0 100 100" class="doelwit-grijs">
                                <circle cx="50" cy="50" r="48" fill="#FFF" stroke="#000" stroke-width="2"/>
                                <circle cx="50" cy="50" r="38" fill="#2F4159"/>
                                <circle cx="50" cy="50" r="28" fill="#52B5D9"/>
                                <circle cx="50" cy="50" r="18" fill="#F05359"/>
                                <circle cx="50" cy="50" r="8"  fill="#FBD036"/>
                            </svg>
                            <svg viewBox="0 0 100 100" class="doelwit-kleur" style="clip-path: inset(${clipWaarde}% 0 0 0)">
                                <circle cx="50" cy="50" r="48" fill="#FFF" stroke="#000" stroke-width="2"/>
                                <circle cx="50" cy="50" r="38" fill="#2F4159"/>
                                <circle cx="50" cy="50" r="28" fill="#52B5D9"/>
                                <circle cx="50" cy="50" r="18" fill="#F05359"/>
                                <circle cx="50" cy="50" r="8"  fill="#FBD036"/>
                            </svg>
                        </div>
                    </div>`;
            });
            document.getElementById('leaderboardLijst').innerHTML = html;
        }

        function updateUI() {
            const speler = spelers[huidigeSpelerIndex];
            
            document.getElementById('huidigeSpelerNaam').innerText = speler.naam;
            document.getElementById('huidigeScore').innerText = speler.totaal;
            
            let getoondePijlen = Math.min(pijlenGeschoten, aantalPijlenPerBeurt);
            let restPijlen = Math.max(0, aantalPijlenPerBeurt - pijlenGeschoten);
            let indicator = '🏹'.repeat(getoondePijlen) + '⚪'.repeat(restPijlen);
            document.getElementById('pijlenIndicator').innerText = indicator;

            const totaalPijlen = speler.scores.length;
            const countStats = { 10: 0, 9: 0, 8: 0, 7: 0, 6: 0, 0: 0 };
            speler.scores.forEach(s => countStats[s]++);

            const pct = (val) => totaalPijlen > 0 ? Math.round((val / totaalPijlen) * 100) : 0;
            const beurten = totaalPijlen / aantalPijlenPerBeurt;
            const avg = beurten > 0 ? (speler.totaal / beurten).toFixed(1) : 0;

            document.getElementById('spelerStats').innerHTML = `
                <div class="stat-lijn">🎯 10: ${countStats[10]} (${pct(countStats[10])}%)</div>
                <div class="stat-lijn">🌑 7: ${countStats[7]} (${pct(countStats[7])}%)</div>
                <div class="stat-lijn">🔴 9: ${countStats[9]} (${pct(countStats[9])}%)</div>
                <div class="stat-lijn">⚪ 6: ${countStats[6]} (${pct(countStats[6])}%)</div>
                <div class="stat-lijn">🔵 8: ${countStats[8]} (${pct(countStats[8])}%)</div>
                <div class="stat-lijn">❌ Mis: ${countStats[0]} (${pct(countStats[0])}%)</div>
                <div class="stat-lijn avg-lijn">📊 Gem. per beurt: ${avg}</div>
            `;

            renderLeaderboard();

            let percentage = (speler.totaal / doelScore) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('doelwitVulling').style.clipPath = `inset(${100 - percentage}% 0 0 0)`;
        }

        function terugNaarMenu() {
            document.getElementById('gewonnen-scherm').style.display = 'none';
            wisselScherm('setup-scherm');
        }

        window.onload = genereerSpelerInputs;
    </script>
</body>
</html>
